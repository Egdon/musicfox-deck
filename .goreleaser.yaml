# Linux and Windows releases. hack/release_container.sh runs this inside
# Ubuntu 22.04 (locally: make release-snapshot); the macOS builds are in
# .goreleaser.darwin.yaml. Both upload to the draft release that
# .github/workflows/release.yaml creates, which also adds SHA256SUMS.
version: 2
project_name: tapefox

env:
  - CGO_ENABLED=1

builds:
  - id: linux-amd64
    main: ./cmd
    binary: tapefox
    goos: [linux]
    goarch: [amd64]
    env:
      - CC=gcc
    flags: &flags [-trimpath]
    ldflags: &ldflags
      - -s -w -X github.com/go-musicfox/go-musicfox/internal/types.AppVersion=v{{ .Version }}
    tags: &tags [enable_global_hotkey, purego]
    mod_timestamp: &mtime "{{ .CommitTimestamp }}"
  - id: linux-arm64
    main: ./cmd
    binary: tapefox
    goos: [linux]
    goarch: [arm64]
    env:
      - CC=aarch64-linux-gnu-gcc
      - PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    flags: *flags
    ldflags: *ldflags
    tags: *tags
    mod_timestamp: *mtime
  - id: windows-amd64
    main: ./cmd
    binary: tapefox
    goos: [windows]
    goarch: [amd64]
    env:
      - CC=x86_64-w64-mingw32-clang
    flags: *flags
    ldflags: *ldflags
    tags: *tags
    mod_timestamp: *mtime
  - id: windows-arm64
    main: ./cmd
    binary: tapefox
    goos: [windows]
    goarch: [arm64]
    env:
      - CC=aarch64-w64-mingw32-clang
    flags: *flags
    ldflags: *ldflags
    tags: *tags
    mod_timestamp: *mtime

archives:
  - id: linux
    ids: [linux-amd64, linux-arm64]
    formats: [tar.gz]
    name_template: &archive "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files: &docs [LICENSE, README.md, README.en.md]
  - id: windows
    ids: [windows-amd64, windows-arm64]
    formats: [zip]
    name_template: *archive
    wrap_in_directory: true
    files: *docs

nfpms:
  - id: packages
    ids: [linux-amd64, linux-arm64]
    package_name: tapefox
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: tapefox
    homepage: https://github.com/Egdon/tapefox
    maintainer: Egdon <Egdon@users.noreply.github.com>
    description: |-
      NetEase Cloud Music in the terminal, with a 3D cassette deck.
      tapefox is a fork of go-musicfox.
    license: GPL-3.0-only
    section: sound
    formats: [deb, rpm, archlinux]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/tapefox/LICENSE
      - src: README.md
        dst: /usr/share/doc/tapefox/README.md
      - src: README.en.md
        dst: /usr/share/doc/tapefox/README.en.md
    # The web login loads WebKitGTK when it is there (Arch packages from
    # nfpm cannot list optional dependencies).
    overrides:
      deb:
        dependencies: ["libc6 (>= 2.34)", libasound2]
        recommends: [libwebkit2gtk-4.1-0]
      rpm:
        dependencies: ["libc.so.6(GLIBC_2.34)(64bit)", "libasound.so.2()(64bit)"]
        recommends: ["libwebkit2gtk-4.1.so.0()(64bit)"]
      archlinux:
        dependencies: [glibc, alsa-lib]
    rpm:
      summary: NetEase Cloud Music in the terminal, with a 3D cassette deck
    archlinux:
      packager: Egdon <Egdon@users.noreply.github.com>

checksum:
  disable: true

changelog:
  disable: true

snapshot:
  version_template: 0.0.0-snapshot

release:
  github:
    owner: Egdon
    name: tapefox
  name_template: "tapefox {{ .Tag }}"
  prerelease: auto
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: keep-existing
