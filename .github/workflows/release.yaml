name: Release

# A tag v* builds every platform into a draft release, tries the packages on
# a range of systems and adds SHA256SUMS. Publishing the draft is left to a
# person; it then updates Homebrew and Scoop (package-managers.yaml). Running
# this workflow by hand builds and tries snapshots without releasing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  GO_VERSION: "1.26.10"
  GORELEASER_VERSION: "v2.18.3"
  # The version the binaries report.
  EXPECT: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-snapshot' }}

jobs:
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          hack/release_notes.sh "$TAG" > notes.md
          flags=()
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --title "tapefox $TAG" --notes-file notes.md "${flags[@]}"

  linux-windows:
    needs: draft
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build in Ubuntu 22.04
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
        run: docker run --rm -v "$PWD:/src" -w /src -e GITHUB_TOKEN ubuntu:22.04 hack/release_container.sh $SNAPSHOT
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  macos:
    needs: draft
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --config .goreleaser.darwin.yaml ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip

  try-linux:
    needs: linux-windows
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && apt-get install -y -qq --no-install-recommends ./tapefox_*_amd64.deb
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq --no-install-recommends ./tapefox_*_amd64.deb
          - image: debian:12
            install: apt-get update -qq && apt-get install -y -qq --no-install-recommends ./tapefox_*_amd64.deb
          - image: fedora:latest
            install: dnf install -y -q --setopt=install_weak_deps=False ./tapefox-*.x86_64.rpm
          - image: opensuse/tumbleweed
            install: zypper -n -q install --no-recommends --allow-unsigned-rpm ./tapefox-*.x86_64.rpm
          - image: archlinux:latest
            install: pacman -Sy --noconfirm && pacman -U --noconfirm ./tapefox-*-x86_64.pkg.tar.zst
          - image: debian:12
            platform: linux/arm64
            install: apt-get update -qq && apt-get install -y -qq --no-install-recommends ./tapefox_*_arm64.deb
    name: try-linux (${{ matrix.image }}${{ matrix.platform && ', arm64' || '' }})
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows
      - if: matrix.platform
        uses: docker/setup-qemu-action@v4
      # Mirrors sometimes fail for a moment, so the installation is retried.
      - name: Install and start
        env:
          PLATFORM: ${{ matrix.platform && format('--platform={0}', matrix.platform) || '' }}
          INSTALL: ${{ matrix.install }}
        run: |
          docker run --rm $PLATFORM -v "$PWD:/pkg" -w /pkg -e EXPECT -e INSTALL "${{ matrix.image }}" \
            sh -c 'for i in 1 2 3; do eval "$INSTALL" && break; [ $i = 3 ] && exit 1; sleep 20; done
              MUSICFOX_ROOT=$(mktemp -d) tapefox --version | tee /dev/stderr | grep -qF "$EXPECT"'

  try-macos:
    needs: macos
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: pkg
      - name: Start the binaries
        run: |
          export MUSICFOX_ROOT=$(mktemp -d)
          for arch in arm64 amd64; do
            mkdir -p "x/$arch" && tar -xzf pkg/tapefox_*_darwin_$arch.tar.gz -C "x/$arch"
          done
          x/arm64/*/tapefox --version | tee /dev/stderr | grep -qF "$EXPECT"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 x/amd64/*/tapefox --version | grep -qF "$EXPECT"
          else
            echo "::notice::No Rosetta on this runner; the Intel binary was not started"
          fi
          unzip -q pkg/tapefox_*_darwin_arm64_macapp.zip -d app
          app/tapefox.app/Contents/MacOS/tapefox --version | grep -qF "$EXPECT"
      - name: Install with the formula
        run: |
          (cd pkg && shasum -a 256 *.tar.gz) > SHA256SUMS
          brew tap-new --no-git local/try
          hack/brew_formula.sh "$EXPECT" SHA256SUMS "file://$PWD/pkg" > "$(brew --repository local/try)/Formula/tapefox.rb"
          brew install local/try/tapefox
          brew test local/try/tapefox

  try-windows:
    needs: linux-windows
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows
          path: pkg
      - name: Start the binary
        shell: pwsh
        run: |
          Expand-Archive (Get-Item pkg/tapefox_*_windows_amd64.zip) -DestinationPath x
          $env:MUSICFOX_ROOT = (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/mfx").FullName
          $out = & (Get-Item x/*/tapefox.exe) --version
          $out
          if ($LASTEXITCODE -ne 0 -or -not ($out -match [regex]::Escape($env:EXPECT))) { throw "tapefox --version failed" }
      # The manifest points at the archives, served from this machine.
      - name: Write a Scoop manifest
        shell: bash
        run: |
          (cd pkg && sha256sum -- *_windows_*.zip) > SHA256SUMS
          hack/scoop_manifest.sh "$EXPECT" SHA256SUMS http://localhost:8000 > tapefox.json
      - name: Install with Scoop
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8000', '--directory', (Resolve-Path pkg).Path -PassThru
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          # A path with forward slashes would read as bucket/app.
          scoop install (Resolve-Path tapefox.json).Path
          $env:MUSICFOX_ROOT = (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/mfx-scoop").FullName
          $out = tapefox --version
          $out
          $ok = $LASTEXITCODE -eq 0 -and ($out -match [regex]::Escape($env:EXPECT))
          Stop-Process -Id $server.Id
          if (-not $ok) { throw "tapefox from Scoop failed" }

  checksums:
    needs: [linux-windows, macos, try-linux, try-macos, try-windows]
    if: ${{ github.ref_type == 'tag' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true
      - name: Add SHA256SUMS to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd pkg && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
